<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
        var stompClient = null;

      function connect()
       {
         const jwtToken = localStorage.getItem("jwtToken");
         console.log("JWT from localStorage:", jwtToken);
         // Pass token via query param (SockJS-compatible)
         const socket = new SockJS("http://localhost:9903/ws"); // ❌ no token in URL
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect(
         {
            Authorization: "Bearer " + jwtToken }, // ✅ Send token in header
            function (frame)
            {
                console.log("Connected: " + frame);
                stompClient.subscribe("/topic/messages", function (message)
                  {
                    showMessage(JSON.parse(message.body), false);
                  }
                 );

           stompClient.subscribe("/user/topic/private", function (message)
            {
                showMessage(JSON.parse(message.body), true);
            }
            );
        },
            function (error) {
            alert("WebSocket connection error: " + error);
            }
          );
       }

        function sendPublicMessage()
         {
            if (!stompClient || !stompClient.connected) {
               alert("WebSocket not connected.");
              return;
                }
            const text = document.getElementById("text").value;
            stompClient.send("/app/public", {}, JSON.stringify({ content: text }));
          }


        function sendPrivateMessage()
         {
            if (!stompClient || !stompClient.connected) {
                alert("WebSocket not connected.");
                return;
            }
            const text = document.getElementById("privateText").value;
            const to = document.getElementById("to").value;
            stompClient.send("/app/private", {}, JSON.stringify({ content: text, recipient: to }));
        }

        function showMessage(message, isPrivate) {
            const messagesDiv = document.getElementById("messages");
            const p = document.createElement("p");

            // Fallback logic: content OR text
            const msgText = message.text || message.content || "N/A";

            p.innerHTML = (isPrivate ? "[Private] " : "") +
                (message.sender || "Unknown") + ": " + msgText;

            messagesDiv.appendChild(p);
}


        window.onload = connect;
    </script>


</head>
<body>
<h2>WebSocket Chat</h2>

<div>
    <input type="text" id="text" placeholder="Public Message" />
    <button onclick="sendPublicMessage()">Send Public</button>
</div>

<br>

<div>
    <input type="text" id="privateText" placeholder="Private Message" />
    <input type="text" id="to" placeholder="Receiver Username" />
    <button onclick="sendPrivateMessage()">Send Private</button>
</div>

<br><hr>
<div id="messages"></div>
</body>
</html>
